<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
  </head>
<body>
	<h1>List Students from table</h1>

	<form action="/student/add" method="get">
		<button type="submit">新增學生</button>
	</form>

	<table>
	<tr>
		<td>流水號</td>
		<td>學號</td>
		<td>姓名</td>
	</tr>
	{% for p in students %}
	<tr>
		<td>
			{{ loop.index }}:<a href="/student/edit/{{p.stuid }}">Edit</a>
			<form action="/student/delete/{{p.stuid}}" method="post" style="display:inline;">
				<button type="submit" onclick="return confirm('確定要刪除嗎？')">刪除</button>
			</form>
		</td>
		<td>{{ p.stuid }} </td>
		<td>{{ p.name }}</td>
	</tr>
	{% endfor %}
	</table>
</body>
</html>
